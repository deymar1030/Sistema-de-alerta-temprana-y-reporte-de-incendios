services:
  mosquitto:
    image: eclipse-mosquitto:2.0.22
    restart: unless-stopped
    ports:
      - "${MQTT_BIND_ADDRESS:-127.0.0.1}:${MQTT_HOST_PORT:-1883}:1883"
    volumes:
      - ./mosquitto.conf.example:/mosquitto/config/mosquitto.conf:ro
      - ./runtime/passwd:/mosquitto/config/passwd:ro
      - ./runtime/acl:/mosquitto/config/acl:ro
      - mosquitto_data:/mosquitto/data
    healthcheck:
      test: ["CMD-SHELL", "kill -0 1"]
      interval: 15s
      timeout: 3s
      retries: 3

volumes:
  mosquitto_data:

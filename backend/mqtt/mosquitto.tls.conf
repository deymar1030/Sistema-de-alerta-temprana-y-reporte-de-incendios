# Plantilla para produccion (VPS). No contiene secretos: "npm run mqtt:conf"
# la renderiza a mqtt/runtime/mosquitto.tls.generado.conf (ignorado por Git)
# sustituyendo los placeholders __..__ desde variables de entorno.
#
# Autenticacion/ACL: en vez de un archivo passwd estatico, el broker consulta
# en vivo al backend (/internal/mqtt/auth y /internal/mqtt/acl), que valida
# contra predio.contrasena_mqtt (hash bcrypt) en Postgres. Cambiar la
# contrasena de un predio desde el frontend surte efecto de inmediato, sin
# reaprovisionar ni reiniciar el broker.
listener 8883

allow_anonymous false
use_username_as_clientid true
retain_available false

certfile /mosquitto/certs/server.crt
keyfile /mosquitto/certs/server.key
tls_version tlsv1.2

auth_plugin /mosquitto/go-auth.so
auth_opt_backends http
auth_opt_http_host __MQTT_AUTH_BACKEND_HOST__
auth_opt_http_port __MQTT_AUTH_BACKEND_PORT__
auth_opt_http_getuser_uri /internal/mqtt/auth
auth_opt_http_aclcheck_uri /internal/mqtt/acl
auth_opt_http_response_mode json
auth_opt_http_params_mode json
auth_opt_http_method POST
auth_opt_http_timeout 5
# Mosquitto-go-auth no soporta cabeceras propias; el User-Agent es la unica
# cabecera personalizable que expone, y se usa como secreto compartido con
# el guard de /internal/mqtt/* (ver api/interfaces/middlewares/mqttAuthGuard.middleware.js).
auth_opt_http_user_agent __MQTT_AUTH_SECRET__

# Evita una llamada HTTP por cada lectura publicada (predios 5-10s/sensor).
# go-cache es en memoria, sin dependencia de Redis.
auth_opt_cache true
auth_opt_cache_reset true
auth_opt_auth_cache_seconds 60
auth_opt_acl_cache_seconds 60
auth_opt_auth_jitter_seconds 5
auth_opt_acl_jitter_seconds 5

persistence true
persistence_location /var/lib/mosquitto/
autosave_interval 60
max_packet_size 4096
max_queued_messages 10000
log_dest stdout

services:
  db:
    image: postgres:16
    container_name: incendios_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: incendios
    ports:
      - "5432:5432"
    volumes:
      - incendios_db_data:/var/lib/postgresql/data
      - ./bd/bd.sql:/docker-entrypoint-initdb.d/01-bd.sql:ro

volumes:
  incendios_db_data:
